<svg width="32" height="32" viewBox="0 0 32 32" xmlns="http://www.w3.org/2000/svg">
  <!-- Background gradient -->
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FEFAE0;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#FAEDCD;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2A9D8F;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1A6B63;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <rect width="32" height="32" fill="url(#bg)" rx="7"/>
  
  <!-- Circular badge container -->
  <circle cx="16" cy="16" r="11" fill="url(#accent)"/>
  
  <!-- Upward chevron representing progress/winning -->
  <path d="M 16 10 L 21 16 L 19 17.5 L 16 14 L 13 17.5 L 11 16 Z" fill="#E9C46A" stroke="none"/>
  
  <!-- Bottom accent dot - representing individual/player -->
  <circle cx="16" cy="21" r="1.5" fill="#E9C46A" opacity="0.9"/>
</svg>
